# test local plugin folder without first requiring a deploy, by overriding
# what plugin folder will be scanned.
# works both for regular lingint via olint, and for testing the undeployed olint
# via ./olint
olint_plugin_dir=plugins

# In order to test low priority linters, skip all linters that might skip
# the one to be tested. Below is a sample to ensure pymarkdown is used,
